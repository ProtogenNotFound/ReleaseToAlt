[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "releasetoalt"
version = "0.1.0"
description = "A CLI tool to push repositories to an alternate GitHub account while anonymizing commit history."
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "rich>=13.0.0",
    "InquirerPy>=0.3.0",
]

[project.scripts]
releasetoalt = "releasetoalt.cli:main"
